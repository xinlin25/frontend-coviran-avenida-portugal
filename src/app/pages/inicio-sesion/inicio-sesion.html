<div class="contenedor">
  <div class="contenido">
    <img src="/img/formularios.jpg" alt="Imagen Frutería Covirán" />
  </div>

  <div class="contenido formulario">
    <h1>Iniciar Sesión</h1>
    <a routerLink="/registro" class="registro">o Crear Cuenta</a>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <input type="email" formControlName="correo" placeholder="Correo electrónico*" />

      <div class="password-container">
        <input
          [type]="mostrarPassword ? 'text' : 'password'"
          formControlName="password"
          placeholder="Contraseña*"
        />

        <button type="button" class="toggle-password" (click)="mostrarPassword = !mostrarPassword">
          <i
            class="bi"
            [class.bi-eye]="!mostrarPassword"
            [class.bi-eye-slash]="mostrarPassword"
          ></i>
        </button>
      </div>

      <a routerLink="/recuperar-contraseña" class="password">¿Has olvidado la contraseña?</a>

      @if (mensaje) {
        <p [class.success]="!esError" [class.error]="esError">{{ mensaje }}</p>
      }

      <button type="submit" [disabled]="loginForm.invalid">Continuar</button>
    </form>
  </div>
</div>
