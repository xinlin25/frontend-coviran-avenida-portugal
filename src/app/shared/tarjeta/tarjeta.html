<div class="tarjeta" [routerLink]="['/detalle-producto', id]">
  <img [src]="imagen || '/img/img-placeholder.jpg'" alt="{{ titulo }}" class="tarjeta-img" />
  <h5 class="titulo">{{ titulo }}</h5>
  <p class="descripcion">{{ descripcion }}</p>
  <p class="precio">
    @if (enOferta && precioOriginal) {
      <span class="precio-original"> {{ precioOriginal | number: '1.2-2' }}€</span>
      <span class="precio-oferta">{{ precio | number: '1.2-2' }}€</span>
      <span class="unidad">/{{ unidad }}</span>
    } @else {
      <span class="precio-normal">{{ precio | number: '1.2-2' }}€</span>
      <span class="unidad">/{{ unidad }}</span>
    }
  </p>
  <button (click)="manejarClick($event)">Añadir</button>
</div>
